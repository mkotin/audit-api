spring.application.name=audit-api

# Le schéma est géré exclusivement par Flyway ; Hibernate se contente de le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La base et le stockage S3 sont déclarés dans le dépôt voisin audit-infra (polyrepo cloné côte à côte).
# Datasource (url, utilisateur, mot de passe) déduite du conteneur par le Docker Compose Support.
# start-only : les services restent démarrés à l'arrêt de l'application.
# Les tests utilisent Testcontainers : spring.docker.compose.skip.in-tests reste à true (défaut).
spring.docker.compose.file=../audit-infra/compose.yaml
spring.docker.compose.profiles.active=infra
spring.docker.compose.lifecycle-management=start-only

# Stockage objet compatible S3 (service stockage-s3 d'audit-infra).
# Le Docker Compose Support ne configure pas S3 : ces valeurs doivent rester cohérentes avec le compose.
app.stockage.endpoint=http://localhost:9000
# Adresse placée dans les URL signées (S3Presigner uniquement), si elle diffère de endpoint pour leurs
# destinataires : voir application-dev.properties et le README. Non renseignée : endpoint.
#app.stockage.endpoint-public=
app.stockage.region=us-east-1
app.stockage.access-key=audit-s3
app.stockage.secret-key=audit-s3-secret
app.stockage.bucket=documents
app.stockage.path-style=true
app.stockage.creer-bucket-au-demarrage=true
app.stockage.duree-url-temporaire=15m

# Upload : 20 Mo par fichier, 100 Mo par requête. Au-delà de 1 Mo, le fichier transite par le disque.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=1MB
# Tomcat lit le reste d'une requête refusée (jusqu'à cette taille) pour que le client reçoive bien le 413.
server.tomcat.max-swallow-size=128MB

# Service audit-core (OCR, classification, extraction), appelé après chaque dépôt.
# Délai de lecture large : OCR d'un scan, appels au LLM avec nouvelles tentatives côté audit-core.
app.core.url=http://localhost:8000
app.core.delai-connexion=5s
app.core.delai-lecture=5m
# Consolidation d'un dossier (POST /v1/consolidation) : calcul sans LLM ni réseau, délai de lecture court.
app.core.delai-lecture-consolidation=30s

# Traitement des documents : lancé après chaque dépôt (automatique), documents traités simultanément, file
# d'attente (au-delà, le document reste RECU), seuil de confiance de classification sous lequel l'extraction porte
# l'alerte classification_peu_fiable, et reprise au démarrage (EN_COURS → ERREUR, RECU remis en file).
app.traitement.automatique=true
app.traitement.parallelisme=2
app.traitement.taille-file=100
app.traitement.seuil-classification=0.5
app.traitement.reprise-au-demarrage=true

# Consolidation automatique des dossiers : poller (intervalle entre deux passages), exécuteur dédié (dossiers
# consolidés simultanément, file d'attente), et délais avant chaque nouvelle tentative après un échec technique
# (le dernier délai se répète, sans limite au nombre de tentatives).
app.consolidation.automatique=true
app.consolidation.intervalle=2s
app.consolidation.parallelisme=2
app.consolidation.taille-file=50
app.consolidation.delais-tentatives=30s,2m,10m,30m

# Identifiant de corrélation du traitement (transmis à audit-core dans X-Request-ID) dans chaque ligne de log.
logging.pattern.correlation=[%X{correlationId:-}] 
