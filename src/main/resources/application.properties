spring.application.name=audit-api

# Le schéma est géré exclusivement par Flyway ; Hibernate se contente de le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La base et le stockage S3 sont déclarés dans le dépôt voisin audit-infra (polyrepo cloné côte à côte).
# Datasource (url, utilisateur, mot de passe) déduite du conteneur par le Docker Compose Support.
# start-only : les services restent démarrés à l'arrêt de l'application.
# Les tests utilisent Testcontainers : spring.docker.compose.skip.in-tests reste à true (défaut).
spring.docker.compose.file=../audit-infra/compose.yaml
spring.docker.compose.profiles.active=infra
spring.docker.compose.lifecycle-management=start-only

# Stockage objet compatible S3 (service stockage-s3 d'audit-infra).
# Le Docker Compose Support ne configure pas S3 : ces valeurs doivent rester cohérentes avec le compose.
app.stockage.endpoint=http://localhost:9000
app.stockage.region=us-east-1
app.stockage.access-key=audit-s3
app.stockage.secret-key=audit-s3-secret
app.stockage.bucket=documents
app.stockage.path-style=true
app.stockage.creer-bucket-au-demarrage=true
app.stockage.duree-url-temporaire=15m

# Upload : 20 Mo par fichier, 100 Mo par requête. Au-delà de 1 Mo, le fichier transite par le disque.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=1MB
# Tomcat lit le reste d'une requête refusée (jusqu'à cette taille) pour que le client reçoive bien le 413.
server.tomcat.max-swallow-size=128MB
