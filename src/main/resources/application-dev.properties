# Profil de développement local : activé par ./mvnw spring-boot:run (configuration du spring-boot-maven-plugin)
# ou par SPRING_PROFILES_ACTIVE=dev dans un IDE. Jamais actif dans le jar packagé ni dans les tests.
#
# Il enregistre les endpoints d'administration et de développement, absents hors de ce profil :
# - DELETE /api/admin/dossiers/{id} (destructif) ;
# - GET /api/admin/documents/{id}/url-temporaire (URL signée, pour tester audit-core à la main).

logging.level.com.melas.audit_api=DEBUG

# Spring tourne sur la machine, audit-core dans Docker : les URL signées doivent désigner le stockage par une
# adresse joignable depuis un conteneur (la signature couvre l'hôte, audit-core ne peut pas la réécrire).
app.stockage.endpoint-public=http://host.docker.internal:9000
